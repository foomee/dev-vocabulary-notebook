<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プログラミング頻出英単語・略語・専門用語の単語帳</title>
    <link rel="stylesheet" href="css/words.css">
</head>
<body>
  <div class="app-shell">

    <main>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">プログラミング頻出英単語帳</h1>
        <p class="intro-text">プログラミング学習をよりスムーズに。</p>
      </section>

      <section class="words" aria-labelledby="overview-title">

        <div class="table-wrap">
          <table>
            <colgroup>
              <col style="width: 20%;">
              <col style="width: 40%;">
              <col style="width: 10%;">
              <col style="width: 10%;">
              <col style="width: 10%;">
              <col style="width: 10%;">
            </colgroup>

            <thead>
              <tr>
                <th class="tag-heading">単語</th>
                <th>タグ</th>
                <th scope="col"><span class="status-label star">★</span></th>
                <th scope="col"><span class="status-label blue">●</span></th>
                <th scope="col"><span class="status-label yellow">●</span></th>
                <th scope="col"><span class="status-label red">●</span></th>
              </tr>
            </thead>
            <tbody id="word-list">
            </tbody>

          </table>
        </div>
      </section>

    </main>

  </div>
  <script src="js/words-data.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/words.js" defer></script>
</body>
</html>
