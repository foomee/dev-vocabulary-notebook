<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プログラミング頻出英単語・略語・専門用語の単語帳</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="app-shell">

    <main>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">プログラミング頻出英単語帳</h1>
        <p class="intro-text">プログラミング学習をよりスムーズに。</p>
      </section>

      <section class="dashboard" aria-labelledby="dashboard-title">
        <div class="table-wrap">
          <table>
            <colgroup>
              <col style="width: 25%;">
              <col style="width: 25%;">
              <col style="width: 50%;">
            </colgroup>
            <thead>
              <tr>
                <th class="tag-heading" colspan="3" id="dashboard-tag"></th></th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row">前回の学習日</th>
                <td>2</td><td rowspan="9"><a class="start" id="start-button" href="">学習開始</a></td>
              </tr>
              <tr>
                <th scope="row">学習回数</th>
                <td>0</td>
              </tr>
              <tr>
                <th scope="row">学習済み単語</th>
                <td id="learned-count">0</td>
              </tr>
              <tr>
                <th scope="row">正解数</th>
                <td id="correct-count">0</td>
              </tr>
              <tr>
                <th scope="row">不正解数</th>
                <td id="incorrect-count">0</td>
              </tr>     
              <tr>
                <th scope="row">★</th>
                <td id="favoriteCount">0</td>
              </tr>
              <tr>
                <th scope="row">🔵</th>
                <td id="mark1Count">0</td>
              </tr>              
              <tr>
                <th scope="row">🟡</th>
                <td id="mark2Count">0</td>
              </tr>
              <tr>
                <th scope="row">🔴</th>
                <td id="mark3Count">0</td>
              </tr>              
            </tbody>
          </table>
        </div>
        <p class="table-note">※ 数字はレイアウト確認用のサンプルです。</p>
      </section>
    </main>

  </div>
  <script src="js/words-data.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/dashboard.js" defer></script>
</body>
</html>
