<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プログラミング頻出英単語・略語・専門用語の単語帳</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">

    <main>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">プログラミング頻出英単語帳</h1>
        <p class="intro-text">プログラミング学習をよりスムーズに。</p>
      </section>

      <section class="overview" aria-labelledby="overview-title">
        <div class="section-heading">
          <div>
            <h2 id="overview-title">学習状況</h2>
          </div>
          <span class="total-label">タグ別の登録数</span>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col" class="tag-heading">タグ</th>
                <th scope="col"><span class="status-label">学習済</span></th>
                <th scope="col"><span class="status-label star">★</span></th>
                <th scope="col"><span class="status-label blue">●</span></th>
                <th scope="col"><span class="status-label yellow">●</span></th>
                <th scope="col"><span class="status-label red">●</span></th>
              </tr>
            </thead>
            <tbody id="tag-list">

            </tbody>
          </table>
        </div>
        <p class="table-note">※ 数字はレイアウト確認用のサンプルです。</p>
      </section>

      <nav class="actions">
        <button class="add-button" id="toggle-form" type="button">
          <span class="button-icon">＋</span>
          <span>カードを追加</span>
        </button>
        <a class="list-button" href="words.html" type="button">
          <span class="button-icon list-icon">≡</span>
          <span>一覧を見る</span>
        </a>
      </nav>


      <form class="add-card" id="add-card-form" hidden>
        <div class="form-row">
          <label for="word">単語</label>
          <input id="word" name="word" type="text" placeholder="単語を入力">
        </div>

        <div class="form-row">
          <label for="description">説明</label>
          <textarea id="description" name="description" rows="3" placeholder="単語の意味や説明を入力"></textarea>
        </div>

        <div class="form-row">
          <label for="tag">タグ</label>
          <div class="tag-input-container" id="tag-container">
            <div class="tag-list" id="selected-tag-list"></div>
            <input id="tag-input" name="tag" type="text" placeholder="タグを入力してEnter">
          </div>
        </div>
        
        <button class="add-btn" type="submit">追加</button>
      </form>

    </main>
  </div>
  <script src="js/words-data.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/main.js" defer></script>  
</body>
</html>
